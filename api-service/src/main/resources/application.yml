server:
  port: 8080

spring:
  application:
    name: api-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fraud_detection_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ML Service downstream integration
ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

# Fraud decision threshold engine
fraud:
  threshold:
    low: 0.30     # Score < 0.30 -> APPROVE
    high: 0.85    # Score >= 0.85 -> BLOCK; [0.30 - 0.85) -> FLAGGED for human review
